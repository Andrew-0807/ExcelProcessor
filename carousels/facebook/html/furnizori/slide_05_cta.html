<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Furnizori – Slide 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    overflow: hidden;
    background: #0F0F0F;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .slide {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 96px;
    position: relative;
    text-align: center;
  }

  .top-accent {
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent 0%, #FF6B00 50%, transparent 100%);
  }

  .question {
    font-size: 24px;
    font-weight: 500;
    color: #444;
    line-height: 1.6;
    margin-bottom: 52px;
    max-width: 680px;
  }

  .cta {
    font-size: 88px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 0.95;
    letter-spacing: -3px;
    margin-bottom: 64px;
  }

  .cta .period { color: #FF6B00; }

  .divider {
    width: 40px; height: 3px;
    background: #FF6B00;
    border-radius: 2px;
    margin: 0 auto 40px;
  }

  .detail {
    font-size: 15px;
    font-weight: 400;
    color: #2E2E2E;
    line-height: 1.6;
    max-width: 560px;
  }

  .detail strong {
    color: #444;
    font-weight: 600;
  }

  .slide-num {
    position: absolute;
    bottom: 52px; right: 96px;
    font-size: 13px; font-weight: 500;
    color: #1E1E1E; letter-spacing: 1px;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent 0%, #FF6B00 50%, transparent 100%);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="top-accent"></div>

  <div class="question">
    Câte PDF-uri de la furnizori introduci<br>manual în contabilitate în fiecare lună?
  </div>

  <div class="cta">
    Trimite-mi<br>un mesaj<span class="period">.</span>
  </div>

  <div class="divider"></div>

  <div class="detail">
    Îți arăt exact cum funcționează pe fișierele tale —<br>
    <strong>înainte să decizi orice.</strong>
  </div>

  <div class="slide-num">5 / 5</div>
  <div class="bottom-bar"></div>
</div>
</body>
</html>
